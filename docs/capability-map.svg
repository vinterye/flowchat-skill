<text x="760" y="620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#172033" text-anchor="start">route_points 显式</text>
<text x="760" y="638" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#485266" text-anchor="start">回环、绕行、故意交叉才用；需标 crossing: true</text>
<text x="40" y="712" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#172033" text-anchor="start">我们怎么思考</text>
<text x="168" y="712" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#485266" text-anchor="start">四条不妥协的规则</text>
<rect x="40" y="736" width="1160" height="78" rx="14" fill="#ffffff" stroke="#dfe4ee" stroke-width="1" opacity="1.0"/>
<rect x="40" y="736" width="4" height="78" rx="2" fill="#4a68e8" opacity="1.0"/>
<text x="64" y="768" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="600" fill="#172033" text-anchor="start">几何是硬门禁，不是建议</text>
<text x="64" y="792" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#485266" text-anchor="start">边长 ≥ 90px、末端箭头段 ≥ 75px、线宽 ≤ 2px、箭头 ≤ 5×5 —— 由渲染器强制执行，不靠人自觉</text>
<rect x="40" y="824" width="1160" height="78" rx="14" fill="#ffffff" stroke="#dfe4ee" stroke-width="1" opacity="1.0"/>
<rect x="40" y="824" width="4" height="78" rx="2" fill="#d75a67" opacity="1.0"/>
<text x="64" y="856" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="600" fill="#172033" text-anchor="start">宁可拒绝，也不伪造</text>
<text x="64" y="880" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#485266" text-anchor="start">路由不合法就报错退出，绝不补一条反向折线让箭头说谎</text>
<rect x="40" y="912" width="1160" height="78" rx="14" fill="#ffffff" stroke="#dfe4ee" stroke-width="1" opacity="1.0"/>
<rect x="40" y="912" width="4" height="78" rx="2" fill="#7657d9" opacity="1.0"/>
<text x="64" y="944" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="600" fill="#172033" text-anchor="start">状态靠虚线与动画，不靠加粗放大</text>
<text x="64" y="968" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#485266" text-anchor="start">粗细是层级信号，不该被状态占用；重量留给结构，状态留给节奏</text>
<rect x="40" y="1000" width="1160" height="78" rx="14" fill="#ffffff" stroke="#dfe4ee" stroke-width="1" opacity="1.0"/>
<rect x="40" y="1000" width="4" height="78" rx="2" fill="#3ea77a" opacity="1.0"/>
<text x="64" y="1032" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="600" fill="#172033" text-anchor="start">输入先校验，静默丢边是 bug 不是容错</text>
<text x="64" y="1056" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#485266" text-anchor="start">悬空引用在 validate 阶段拦下，而不是渲染出一个缺边但好看的页面</text>
